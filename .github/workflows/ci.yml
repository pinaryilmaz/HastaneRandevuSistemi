name: Frontend CI

on:
  push:
    branches: [main, frontend-backend-integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Biçimi denetle
        run: npm run format:check

      - name: TypeScript'i denetle
        run: npm run typecheck

      - name: ESLint'i çalıştır
        run: npm run lint

      - name: Testleri ve kapsam eşiklerini çalıştır
        run: npm run test:coverage

      - name: Üretim paketini oluştur
        run: npm run build
